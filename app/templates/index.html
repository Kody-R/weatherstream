<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roller Weather Network</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">WEATHERSTREAM v0.1.7.1</div>
        <h1>Roller Weather Network</h1>
      </div>
      <a class="button" href="/admin">Open Admin</a>
    </header>

    <section class="card preview-card">
      <div class="card-head">
        <div>
          <h2>Live Renderer Preview</h2>
          <p>This preview refreshes once per second. The IPTV output is encoded separately as HLS.</p>
        </div>
        <span class="pill" id="streamState">Checking…</span>
      </div>
      <img id="preview" class="preview" src="/preview.jpg" alt="WeatherStream preview">
    </section>

    <section class="grid two">
      <article class="card">
        <h2>IPTV endpoints</h2>
        <label>M3U tuner URL</label>
        <code id="m3uUrl"></code>
        <label>Direct HLS URL</label>
        <code id="hlsUrl"></code>
        <label>XMLTV guide URL</label>
        <code id="xmltvUrl"></code>
      </article>
      <article class="card">
        <h2>System status</h2>
        <div class="status-grid" id="statusGrid"></div>
      </article>
    </section>
  </main>
<script>
const base = window.location.origin;
document.getElementById('m3uUrl').textContent = base + '/playlist.m3u';
document.getElementById('hlsUrl').textContent = base + '/live/weather.m3u8';
document.getElementById('xmltvUrl').textContent = base + '/guide.xml';
setInterval(() => {
  document.getElementById('preview').src = '/preview.jpg?t=' + Date.now();
}, 1000);

async function refreshStatus() {
  try {
    const s = await fetch('/api/status').then(r => r.json());
    const stream = s.stream || {};
    document.getElementById('streamState').textContent = stream.running ? 'STREAMING' : 'OFFLINE';
    document.getElementById('streamState').className = 'pill ' + (stream.running ? 'ok' : 'bad');
    const w = s.weather || {};
    document.getElementById('statusGrid').innerHTML = `
      <div><span>Locations</span><strong>${s.configured_locations}</strong></div>
      <div><span>Loaded</span><strong>${w.locations_loaded}</strong></div>
      <div><span>Alerts</span><strong>${w.active_alerts}</strong></div>
      <div><span>Severe Mode</span><strong>${s.severe_weather?.takeover_active ? 'ACTIVE' : 'Normal'}</strong></div>
      <div><span>Map Cities</span><strong>${s.places?.cities_loaded || 0}</strong></div>
      <div><span>Regional Map</span><strong>${s.radar?.maps_ready?.regional ? 'Ready' : 'Loading'}</strong></div>
      <div><span>Storm Guidance</span><strong>${s.storm_guidance?.available ? 'Ready' : 'Waiting'}</strong></div>
      <div><span>SPC Day 1</span><strong>${s.spc?.day1_risk || 'Waiting'}</strong></div>
      <div><span>Daypart</span><strong>${s.programming?.daypart || '--'}</strong></div>
      <div><span>History</span><strong>${s.history?.rows || 0} samples</strong></div>
      <div><span>Playlist</span><strong>${stream.playlist_ready ? 'Ready' : 'Starting'}</strong></div>
    `;
  } catch (e) {}
}
refreshStatus(); setInterval(refreshStatus, 5000);
</script>
</body>
</html>
